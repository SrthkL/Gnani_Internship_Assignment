# Local container verification or a private VM. Railway instructions: DEPLOYMENT.md.
services:
  backend:
    build: ./backend
    env_file: ./backend/.env.production
    environment:
      APP_ENV: production
      STORAGE_DIR: /data
      HOST: 0.0.0.0
      PORT: "8010"
    volumes:
      - audio-data:/data
    restart: unless-stopped
    stop_grace_period: 130s
  frontend:
    build:
      context: ./Frontend
      args:
        BACKEND_URL: http://backend:8010
    ports:
      - "127.0.0.1:3005:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  audio-data:
